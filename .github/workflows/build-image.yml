name: Build on push to main

on:
  push:
    branches:
    - main

jobs:
  build-unstable:
    name: Build unstable ${{ github.sha }}
    uses: bertrama/cite-caddy/.github/workflows/build-unstable.yml
    with:
      tag: ${{ github.sha }}
      dockerfile: Dockerfile
    secrets:
      GH_PACKAGE_READ_TOKEN: ${{ secrets.GH_PACKAGE_READ_TOKEN }}
