name: Publish npm placeholder

on:
  workflow_dispatch:
    inputs:
      otp:
        description: '2FA one-time password from your authenticator app (needed at publish time -- expires in ~30s)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish placeholder package
        working-directory: npm
        run: npm publish --access public --otp="${{ github.event.inputs.otp }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
